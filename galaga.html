<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GALAGA</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05060d;
    color: #cfe6ff;
    font-family: "Consolas", "D2Coding", ui-monospace, monospace;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
  }
  #game {
    display: block;
    background: #000;
    border: 2px solid #1b3358;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(40,120,255,.25), inset 0 0 60px rgba(0,0,0,.8);
    image-rendering: pixelated;
    max-width: 100%;
    max-height: calc(100vh - 70px);
    aspect-ratio: 480 / 640;
  }
  #help {
    font-size: 12px;
    letter-spacing: .5px;
    color: #55719c;
    text-align: center;
    line-height: 1.6;
  }
  #help b { color: #8fb8ec; font-weight: 600; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="help">
    <b>← →</b> 이동 &nbsp;·&nbsp; <b>SPACE</b> 발사 &nbsp;·&nbsp; <b>P</b> 일시정지 &nbsp;·&nbsp; <b>M</b> 음소거 &nbsp;·&nbsp; <b>R</b> 재시작
  </div>
</div>

<script>
(() => {
"use strict";

// ============================================================
//  기본 설정
// ============================================================
const cv  = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
ctx.imageSmoothingEnabled = false;

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));

// ============================================================
//  사운드 (Web Audio API)
// ============================================================
let actx = null, master = null, muted = false;

function audioInit() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = 0.35;
  master.connect(actx.destination);
}

function tone(f0, f1, dur, type = "square", vol = 0.5, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

function noiseBurst(dur, vol = 0.5, f0 = 1800, f1 = 120) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = actx.createBufferSource(); src.buffer = buf;
  const flt = actx.createBiquadFilter();
  flt.type = "lowpass";
  flt.frequency.setValueAtTime(f0, t);
  flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur);
}

const SFX = {
  shoot:      () => tone(1200, 380, 0.09, "square", 0.22),
  enemyShoot: () => tone(340, 150, 0.14, "sawtooth", 0.14),
  hit:        () => { noiseBurst(0.22, 0.5, 2600, 200); tone(520, 90, 0.14, "square", 0.16); },
  bigHit:     () => { noiseBurst(0.42, 0.7, 2000, 90);  tone(300, 60, 0.28, "sawtooth", 0.20); },
  death:      () => { noiseBurst(0.6, 0.7, 900, 60);
                      tone(500, 40, 0.7, "sawtooth", 0.28); },
  dive:       () => tone(220, 880, 0.22, "triangle", 0.12),
  stage:      () => [0, 1, 2, 3].forEach(i => tone([523,659,784,1047][i], [523,659,784,1047][i], 0.16, "square", 0.18, i * 0.12)),
  extraLife:  () => [0, 1, 2].forEach(i => tone([784,1047,1568][i], [784,1047,1568][i], 0.14, "triangle", 0.22, i * 0.08)),
  gameover:   () => [0,1,2,3].forEach(i => tone([440,370,294,196][i], [440,370,294,196][i], 0.32, "sawtooth", 0.2, i * 0.22)),
};

// ============================================================
//  스프라이트 (문자 → 색상)
// ============================================================
function makeSprite(rows, px) {
  const w = Math.max(...rows.map(r => r.length));
  return { rows, px, w: w * px, h: rows.length * px, cols: w };
}

function drawSprite(sp, cx, cy, palette, alpha = 1) {
  const px = sp.px;
  const x0 = Math.round(cx - sp.w / 2);
  const y0 = Math.round(cy - sp.h / 2);
  ctx.globalAlpha = alpha;
  for (let r = 0; r < sp.rows.length; r++) {
    const row = sp.rows[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === "." || ch === " ") continue;
      const col = palette[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x0 + c * px, y0 + r * px, px, px);
    }
  }
  ctx.globalAlpha = 1;
}

const SP_PLAYER = makeSprite([
  "....1....",
  "...111...",
  "...121...",
  "..11211..",
  "..12321..",
  ".1122111.",
  "11.111.11",
  "1.1...1.1",
], 3);

const PAL_PLAYER = { "1": "#4fd2ff", "2": "#e8f7ff", "3": "#ff4d4d" };

// 적 A - 상단(보스급), 3HP
const SP_A = makeSprite([
  ".1......1.",
  "..1....1..",
  ".11222211.",
  "1122332211",
  "1223333221",
  ".22311322.",
  "..1....1..",
  ".1......1.",
], 3);

// 적 B - 중단
const SP_B = makeSprite([
  "..1....1..",
  "...1..1...",
  "..122221..",
  ".12233221.",
  "1122222211",
  ".11.22.11.",
  "..1....1..",
  ".1......1.",
], 3);

// 적 C - 하단(잡졸)
const SP_C = makeSprite([
  "...1..1...",
  "..111111..",
  ".12122121.",
  "1122222211",
  ".11322311.",
  "..122221..",
  ".1.1..1.1.",
  "1........1",
], 3);

const ENEMY_TYPES = [
  { name: "FLAGSHIP", sprite: SP_A, hp: 3, score: 150, diveScore: 400,
    pal: { "1": "#ff3d6e", "2": "#ffd23d", "3": "#fff6c9" }, diveWeight: 3, fire: 1.0 },
  { name: "ESCORT",   sprite: SP_B, hp: 2, score:  80, diveScore: 160,
    pal: { "1": "#c56bff", "2": "#63e0ff", "3": "#ffffff" }, diveWeight: 2, fire: 0.8 },
  { name: "DRONE",    sprite: SP_C, hp: 1, score:  30, diveScore:  60,
    pal: { "1": "#3dff9e", "2": "#0fb8ff", "3": "#eaffe0" }, diveWeight: 1, fire: 0.6 },
];

// ============================================================
//  게임 상태
// ============================================================
const COLS = 9;
const COL_SP = 46, ROW_SP = 38;
const FORM_TOP = 96;

let state = "title";          // title | play | clear | dead | over | pause
let stage = 1, score = 0, lives = 3;
let hiScore = +(localStorage.getItem("galaga.hi") || 0);
let nextExtra = 10000;

let player, bullets, ebullets, enemies, particles, stars;
let formOffX, formDir, formDrop, formSpeed;
let totalEnemies, diveTimer, banner, bannerT, shake, prevState;

const keys = Object.create(null);

// ============================================================
//  초기화
// ============================================================
function initStars() {
  stars = [];
  for (let i = 0; i < 110; i++) {
    const layer = randi(0, 2);
    stars.push({
      x: rand(0, W), y: rand(0, H),
      sp: 18 + layer * 34,
      s: layer === 2 ? 2 : 1,
      c: ["#3a4c6b", "#7f9ac2", "#dbe9ff"][layer],
    });
  }
}

function resetPlayer() {
  player = { x: W / 2, y: H - 54, w: SP_PLAYER.w - 6, h: SP_PLAYER.h,
             cd: 0, inv: 2.2, alive: true, dying: 0 };
}

function newGame() {
  stage = 1; score = 0; lives = 3; nextExtra = 10000;
  particles = [];
  buildStage();
  state = "play";
}

function buildStage() {
  bullets = []; ebullets = []; particles = particles || [];
  enemies = [];
  resetPlayer();
  player.inv = 1.6;

  const rows = clamp(3 + Math.floor((stage - 1) / 2), 3, 5);
  const originX = (W - (COLS - 1) * COL_SP) / 2;

  for (let r = 0; r < rows; r++) {
    // 위쪽 줄일수록 강한 적
    const type = r === 0 ? 0 : (r === 1 ? 1 : 2);
    for (let c = 0; c < COLS; c++) {
      const t = ENEMY_TYPES[type];
      enemies.push({
        type, t,
        col: c, row: r,
        hx: originX + c * COL_SP,
        hy: FORM_TOP + r * ROW_SP,
        x: originX + c * COL_SP + rand(-40, 40),
        y: -80 - r * 46 - rand(0, 40),
        w: t.sprite.w - 6, h: t.sprite.h - 6,
        hp: t.hp + (stage >= 5 && type === 0 ? 1 : 0),
        alive: true,
        mode: "enter",           // enter | form | dive | return
        t0: 0, flash: 0,
        amp: 0, dir: 1, vy: 0, shootCd: rand(0.4, 1.4),
        wob: rand(0, Math.PI * 2),
      });
    }
  }

  totalEnemies = enemies.length;
  formOffX = 0; formDir = 1; formDrop = 0;
  formSpeed = 22 + (stage - 1) * 6;
  diveTimer = 2.4;
  shake = 0;
  banner = "STAGE " + stage;
  bannerT = 1.8;
  SFX.stage();
}

// ============================================================
//  입력
// ============================================================
addEventListener("keydown", e => {
  const k = e.key;
  if ([" ", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(k)) e.preventDefault();
  if (!keys[k]) keys[k + "_p"] = true;
  keys[k] = true;
  audioInit();

  const lk = k.toLowerCase();
  if (lk === "m") { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.35; }
  if (lk === "p" && (state === "play" || state === "pause")) {
    if (state === "play") { prevState = state; state = "pause"; }
    else state = "play";
  }
  if (lk === "escape" && state === "play") state = "pause";
  if (lk === "r" && state !== "title") newGame();
  if (k === " " && (state === "title" || state === "over")) newGame();
}, false);

addEventListener("keyup", e => { keys[e.key] = false; }, false);
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

// ============================================================
//  헬퍼
// ============================================================
function hits(a, b) {
  return Math.abs(a.x - b.x) * 2 < (a.w + b.w) &&
         Math.abs(a.y - b.y) * 2 < (a.h + b.h);
}

function boom(x, y, color, n = 18, spd = 190, life = 0.6) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.25, spd);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(life * 0.5, life), max: life,
      size: rand(1.5, 3.5), c: color,
    });
  }
}

function addScore(n) {
  score += n;
  if (score >= nextExtra) { lives++; nextExtra += 20000; SFX.extraLife(); }
  if (score > hiScore) { hiScore = score; localStorage.setItem("galaga.hi", hiScore); }
}

function aliveEnemies() { return enemies.filter(e => e.alive); }

// ============================================================
//  업데이트
// ============================================================
function update(dt) {
  // 별
  for (const s of stars) {
    s.y += s.sp * dt;
    if (s.y > H) { s.y = -2; s.x = rand(0, W); }
  }

  // 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 3.5);
  if (bannerT > 0) bannerT -= dt;

  if (state !== "play" && state !== "dead" && state !== "clear") return;

  // ---------- 플레이어 ----------
  if (state === "play" && player.alive) {
    let vx = 0;
    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) vx -= 1;
    if (keys["ArrowRight"] || keys["d"] || keys["D"]) vx += 1;
    player.x = clamp(player.x + vx * 305 * dt, 18, W - 18);

    player.cd -= dt;
    if (player.inv > 0) player.inv -= dt;

    if (keys[" "] && player.cd <= 0 && bullets.length < 3) {
      bullets.push({ x: player.x, y: player.y - 16, w: 4, h: 12, vy: -680 });
      player.cd = 0.19;
      SFX.shoot();
    }
  }

  if (state === "dead") {
    player.dying -= dt;
    if (player.dying <= 0) {
      if (lives <= 0) {
        state = "over"; banner = "GAME OVER"; bannerT = 999;
        SFX.gameover();
      } else {
        resetPlayer();
        state = "play";
      }
    }
  }

  // ---------- 아군 총알 ----------
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y += b.vy * dt;
    if (b.y < -16) { bullets.splice(i, 1); continue; }
    for (const e of enemies) {
      if (!e.alive || e.mode === "enter") continue;
      if (hits(b, e)) {
        bullets.splice(i, 1);
        e.hp--; e.flash = 0.09;
        if (e.hp <= 0) {
          e.alive = false;
          const gained = e.mode === "dive" ? e.t.diveScore : e.t.score;
          addScore(gained);
          particles.push({ text: "+" + gained, x: e.x, y: e.y, vx: 0, vy: -34,
                           life: 0.85, max: 0.85, c: e.t.pal["2"], size: 0 });
          boom(e.x, e.y, e.t.pal["1"], e.type === 0 ? 26 : 16, e.type === 0 ? 250 : 180);
          boom(e.x, e.y, e.t.pal["2"], 8, 120, 0.45);
          if (e.type === 0) { SFX.bigHit(); shake = 0.35; } else SFX.hit();
        } else {
          boom(e.x, e.y, "#ffffff", 5, 90, 0.25);
          SFX.hit();
        }
        break;
      }
    }
  }

  // ---------- 적 총알 ----------
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 16 || b.x < -16 || b.x > W + 16) { ebullets.splice(i, 1); continue; }
    if (state === "play" && player.alive && player.inv <= 0 && hits(b, player)) {
      ebullets.splice(i, 1);
      killPlayer();
    }
  }

  // ---------- 편대 이동 ----------
  const alive = aliveEnemies();
  const inForm = alive.filter(e => e.mode === "form");

  if (inForm.length) {
    const killedRatio = 1 - alive.length / totalEnemies;
    const spd = formSpeed * (1 + killedRatio * 2.6);
    formOffX += formDir * spd * dt;

    let minX = Infinity, maxX = -Infinity;
    for (const e of inForm) {
      minX = Math.min(minX, e.hx + formOffX - e.w / 2);
      maxX = Math.max(maxX, e.hx + formOffX + e.w / 2);
    }
    if (maxX > W - 12 && formDir > 0) { formDir = -1; formDrop += 14; }
    if (minX < 12 && formDir < 0)     { formDir =  1; formDrop += 14; }
  }

  // ---------- 적 개별 처리 ----------
  for (const e of alive) {
    const hx = e.hx + formOffX;
    const hy = e.hy + formDrop;

    if (e.flash > 0) e.flash -= dt;

    if (e.mode === "enter") {
      e.x += (hx - e.x) * Math.min(1, dt * 3.2);
      e.y += Math.min(260 * dt, (hy - e.y) * Math.min(1, dt * 3.2) + 90 * dt);
      if (Math.abs(e.y - hy) < 4 && Math.abs(e.x - hx) < 4) {
        e.mode = "form"; e.x = hx; e.y = hy;
      }
    } else if (e.mode === "form") {
      e.wob += dt * 2.2;
      e.x = hx;
      e.y = hy + Math.sin(e.wob + e.col * 0.4) * 2.5;
    } else if (e.mode === "dive") {
      e.t0 += dt;
      e.y += e.vy * dt;
      e.x += Math.cos(e.t0 * 3.4) * e.amp * e.dir * dt;
      // 플레이어 추적
      if (player.alive && e.y < player.y - 40) e.x += (player.x - e.x) * 0.5 * dt;
      e.x = clamp(e.x, 14, W - 14);

      e.shootCd -= dt;
      if (e.shootCd <= 0 && e.y < H - 120) {
        enemyFire(e, true);
        e.shootCd = rand(0.5, 1.2);
      }
      if (e.y > H + 40) {
        e.mode = "return"; e.y = -46; e.x = hx;
      }
    } else if (e.mode === "return") {
      e.x += (hx - e.x) * Math.min(1, dt * 4);
      e.y += 230 * dt;
      if (e.y >= hy) { e.y = hy; e.mode = "form"; }
    }

    // 편대 사격
    if (e.mode === "form") {
      e.shootCd -= dt * (0.55 + stage * 0.16) * e.t.fire;
      if (e.shootCd <= 0) {
        // 같은 열의 최하단만 발사
        const below = alive.some(o => o !== e && o.col === e.col && o.mode === "form" && o.row > e.row);
        if (!below && Math.random() < 0.55) enemyFire(e, false);
        e.shootCd = rand(1.6, 4.2);
      }
    }

    // 몸통 충돌
    if (state === "play" && player.alive && player.inv <= 0 && e.mode !== "enter" && hits(e, player)) {
      e.alive = false;
      boom(e.x, e.y, e.t.pal["1"], 18, 200);
      killPlayer();
    }

    // 편대가 너무 내려오면 사망
    if (e.mode === "form" && e.y > player.y - 24 && state === "play" && player.alive) {
      killPlayer();
      formDrop = Math.max(0, formDrop - 90);
    }
  }

  // ---------- 강하 발동 ----------
  if (state === "play") {
    diveTimer -= dt;
    if (diveTimer <= 0) {
      const cands = alive.filter(e => e.mode === "form");
      if (cands.length) {
        const pool = [];
        for (const e of cands) for (let i = 0; i < e.t.diveWeight; i++) pool.push(e);
        const count = clamp(1 + Math.floor(stage / 3), 1, 3);
        const picked = new Set();
        for (let i = 0; i < count && pool.length; i++) {
          const e = pool[randi(0, pool.length - 1)];
          if (picked.has(e)) continue;
          picked.add(e);
          startDive(e);
        }
        SFX.dive();
      }
      diveTimer = Math.max(0.9, rand(2.6, 4.4) - stage * 0.18);
    }
  }

  // ---------- 스테이지 클리어 ----------
  if (state === "play" && alive.length === 0) {
    state = "clear";
    banner = "STAGE " + stage + " CLEAR!";
    bannerT = 2.2;
    ebullets = [];
    setTimeout(() => {
      if (state === "clear") { stage++; buildStage(); state = "play"; }
    }, 2000);
  }
}

function startDive(e) {
  e.mode = "dive";
  e.t0 = 0;
  e.dir = Math.random() < 0.5 ? -1 : 1;
  e.amp = rand(140, 300);
  e.vy = (128 + stage * 14) * rand(0.9, 1.2);
  e.shootCd = rand(0.25, 0.7);
}

function enemyFire(e, aimed) {
  const sp = 210 + stage * 16;
  let vx = 0, vy = sp;
  if (aimed && player.alive) {
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    vx = dx / d * sp * 0.6; vy = dy / d * sp;
  }
  ebullets.push({ x: e.x, y: e.y + 12, w: 5, h: 12, vx, vy, c: e.t.pal["1"] });
  SFX.enemyShoot();
}

function killPlayer() {
  if (!player.alive) return;
  player.alive = false;
  player.dying = 1.5;
  lives--;
  state = "dead";
  shake = 0.7;
  boom(player.x, player.y, "#4fd2ff", 34, 280, 0.9);
  boom(player.x, player.y, "#ffffff", 14, 150, 0.6);
  boom(player.x, player.y, "#ff9c3d", 20, 210, 0.8);
  SFX.death();
}

// ============================================================
//  렌더
// ============================================================
function drawShip(x, y, sc, alpha) {
  const sp = SP_PLAYER, px = sp.px * sc;
  const x0 = Math.round(x - (sp.cols * px) / 2);
  const y0 = Math.round(y - (sp.rows.length * px) / 2);
  ctx.globalAlpha = alpha;
  for (let r = 0; r < sp.rows.length; r++) {
    for (let c = 0; c < sp.rows[r].length; c++) {
      const ch = sp.rows[r][c];
      if (ch === ".") continue;
      ctx.fillStyle = PAL_PLAYER[ch];
      ctx.fillRect(x0 + c * px, y0 + r * px, px, px);
    }
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.fillStyle = "#04050c";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0) {
    ctx.translate(rand(-1, 1) * shake * 9, rand(-1, 1) * shake * 9);
  }

  // 별
  for (const s of stars) {
    ctx.fillStyle = s.c;
    ctx.fillRect(s.x | 0, s.y | 0, s.s, s.s);
  }

  if (state === "title") {
    drawTitle();
    ctx.restore();
    return;
  }

  // 적
  for (const e of enemies) {
    if (!e.alive) continue;
    let pal = e.t.pal;
    if (e.flash > 0) pal = { "1": "#fff", "2": "#fff", "3": "#fff" };
    if (e.mode === "dive") {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(Math.sin(e.t0 * 3.4) * 0.35 * e.dir);
      drawSprite(e.t.sprite, 0, 0, pal);
      ctx.restore();
    } else {
      drawSprite(e.t.sprite, e.x, e.y, pal);
    }
  }

  // 아군 총알
  for (const b of bullets) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(b.x - 1.5, b.y - 8, 3, 14);
    ctx.fillStyle = "#5fe3ff";
    ctx.fillRect(b.x - 2.5, b.y - 4, 5, 8);
  }

  // 적 총알
  for (const b of ebullets) {
    ctx.fillStyle = b.c || "#ff5f7a";
    ctx.fillRect(b.x - 2.5, b.y - 6, 5, 12);
    ctx.fillStyle = "#fff2c9";
    ctx.fillRect(b.x - 1, b.y - 3, 2, 6);
  }

  // 파티클
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.text) {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      ctx.font = "bold 13px Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      const s = p.size * a + 0.6;
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
      ctx.globalAlpha = 1;
    }
  }

  // 플레이어
  if (player && player.alive) {
    const blink = player.inv > 0 && (Math.floor(performance.now() / 70) % 2 === 0);
    if (!blink) {
      drawShip(player.x, player.y, 1, 1);
      // 엔진 불꽃
      const f = 3 + Math.random() * 4;
      ctx.fillStyle = "#ff9c3d";
      ctx.fillRect(player.x - 4, player.y + 12, 3, f);
      ctx.fillRect(player.x + 1, player.y + 12, 3, f);
      ctx.fillStyle = "#ffe9a8";
      ctx.fillRect(player.x - 3.5, player.y + 12, 2, f * 0.55);
      ctx.fillRect(player.x + 1.5, player.y + 12, 2, f * 0.55);
    }
  }

  ctx.restore();

  drawHUD();

  if (bannerT > 0 && banner) {
    const a = state === "over" ? 1 : clamp(bannerT / 0.5, 0, 1);
    ctx.globalAlpha = a;
    ctx.textAlign = "center";
    ctx.font = "bold 30px Consolas, monospace";
    ctx.fillStyle = "#001018";
    ctx.fillText(banner, W / 2 + 2, H / 2 + 2);
    ctx.fillStyle = state === "over" ? "#ff5f7a" : "#ffd23d";
    ctx.fillText(banner, W / 2, H / 2);
    ctx.globalAlpha = 1;
  }

  if (state === "over") {
    ctx.textAlign = "center";
    ctx.font = "15px Consolas, monospace";
    ctx.fillStyle = "#9fc4f0";
    ctx.fillText("SCORE  " + score, W / 2, H / 2 + 40);
    ctx.fillText("STAGE  " + stage, W / 2, H / 2 + 62);
    ctx.fillStyle = (Math.floor(performance.now() / 450) % 2) ? "#cfe6ff" : "#3f5c86";
    ctx.fillText("PRESS SPACE TO RESTART", W / 2, H / 2 + 100);
  }

  if (state === "pause") {
    ctx.fillStyle = "rgba(0,8,20,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.font = "bold 28px Consolas, monospace";
    ctx.fillStyle = "#ffd23d";
    ctx.fillText("PAUSED", W / 2, H / 2);
    ctx.font = "13px Consolas, monospace";
    ctx.fillStyle = "#7f9ac2";
    ctx.fillText("P 키로 계속", W / 2, H / 2 + 28);
  }
}

function drawHUD() {
  ctx.textAlign = "left";
  ctx.font = "12px Consolas, monospace";
  ctx.fillStyle = "#5f7fae";
  ctx.fillText("SCORE", 12, 18);
  ctx.fillText("STAGE", W / 2 - 24, 18);
  ctx.textAlign = "right";
  ctx.fillText("HI-SCORE", W - 12, 18);

  ctx.font = "bold 17px Consolas, monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#e8f7ff";
  ctx.fillText(String(score).padStart(6, "0"), 12, 37);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd23d";
  ctx.fillText(String(stage), W / 2 - 8, 37);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ff8fa8";
  ctx.fillText(String(hiScore).padStart(6, "0"), W - 12, 37);

  // 목숨
  for (let i = 0; i < Math.min(lives, 6); i++) {
    drawShip(22 + i * 26, H - 14, 0.7, 0.9);
  }
  if (lives > 6) {
    ctx.textAlign = "left";
    ctx.font = "12px Consolas, monospace";
    ctx.fillStyle = "#9fc4f0";
    ctx.fillText("x" + lives, 22 + 6 * 26, H - 10);
  }

  if (muted) {
    ctx.textAlign = "right";
    ctx.font = "11px Consolas, monospace";
    ctx.fillStyle = "#5f7fae";
    ctx.fillText("MUTED", W - 12, H - 10);
  }
}

let titleT = 0;
function drawTitle() {
  ctx.textAlign = "center";

  ctx.font = "bold 52px Consolas, monospace";
  ctx.fillStyle = "#0b2a4a";
  ctx.fillText("GALAGA", W / 2 + 3, 152 + 3);
  const grad = ctx.createLinearGradient(0, 110, 0, 165);
  grad.addColorStop(0, "#7fe9ff");
  grad.addColorStop(1, "#2a7bff");
  ctx.fillStyle = grad;
  ctx.fillText("GALAGA", W / 2, 152);

  ctx.font = "13px Consolas, monospace";
  ctx.fillStyle = "#5f7fae";
  ctx.fillText("CANVAS  SHOOTER", W / 2, 178);

  // 적 소개
  const info = [
    { t: 0, label: "FLAGSHIP", pts: "150 / 400" },
    { t: 1, label: "ESCORT",   pts: " 80 / 160" },
    { t: 2, label: "DRONE",    pts: " 30 /  60" },
  ];
  ctx.font = "13px Consolas, monospace";
  info.forEach((it, i) => {
    const y = 258 + i * 46;
    const T = ENEMY_TYPES[it.t];
    drawSprite(T.sprite, W / 2 - 92, y, T.pal);
    ctx.textAlign = "left";
    ctx.fillStyle = "#cfe6ff";
    ctx.fillText(it.label, W / 2 - 62, y + 5);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffd23d";
    ctx.fillText(it.pts + " PTS", W / 2 + 100, y + 5);
  });

  ctx.textAlign = "center";
  drawShip(W / 2, 442, 1.2, 1);

  ctx.font = "bold 16px Consolas, monospace";
  ctx.fillStyle = (Math.floor(titleT * 2) % 2) ? "#e8f7ff" : "#39557f";
  ctx.fillText("PRESS  SPACE  TO  START", W / 2, 508);

  ctx.font = "12px Consolas, monospace";
  ctx.fillStyle = "#4b6a95";
  ctx.fillText("← →  MOVE      SPACE  FIRE", W / 2, 548);
  ctx.fillText("P  PAUSE      M  MUTE      R  RESTART", W / 2, 570);

  ctx.fillStyle = "#ff8fa8";
  ctx.fillText("HI-SCORE  " + String(hiScore).padStart(6, "0"), W / 2, 606);
}

// ============================================================
//  루프
// ============================================================
initStars();
resetPlayer();
enemies = []; bullets = []; ebullets = []; particles = [];
banner = ""; bannerT = 0; shake = 0; totalEnemies = 1;
formOffX = 0; formDir = 1; formDrop = 0; formSpeed = 20; diveTimer = 99;

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;   // 탭 전환 후 폭주 방지
  titleT += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
