<script>
(() => {
'use strict';

// ─────────────────────────────────────────────────────────────

const ctx = cv.getContext('2d');

const TILE_EMPTY = 0, TILE_SOLID = 1, TILE_ONEWAY = 2;

// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────

//   코인/적은 지형에서 자동 생성 + 추가 배치
// ─────────────────────────────────────────────────────────────
const LEVEL_DEFS = [
  {

    ground: [[0,20],[23,22],[48,22],[73,17]],
    plats: [

    ],

  },
  {

    ground: [[0,14],[17,9],[29,11],[43,8],[54,12],[69,9],[81,10],[94,16]],
    plats: [
      {x:5,y:9,w:3}, {x:10,y:6,w:3}, {x:15,y:9,w:2}, {x:20,y:7,w:4},

      {x:67,y:9,w:2}, {x:71,y:6,w:4}, {x:76,y:3,w:3}, {x:79,y:9,w:2},
      {x:83,y:7,w:4}, {x:89,y:5,w:3}, {x:92,y:9,w:2}, {x:97,y:7,w:4},

  },
  {

      {x:50,y:4,w:3}, {x:53,y:9,w:2}, {x:57,y:6,w:3}, {x:61,y:9,w:2},
      {x:65,y:7,w:4}, {x:70,y:4,w:3}, {x:72,y:9,w:2}, {x:76,y:6,w:4},
      {x:82,y:9,w:2}, {x:85,y:7,w:4}, {x:90,y:4,w:3}, {x:91,y:9,w:2},
      {x:96,y:7,w:4}, {x:102,y:5,w:3}, {x:108,y:8,w:4}, {x:114,y:6,w:3},
    ],

  },
  {

    width: 130,
    ground: [[0,9],[12,6],[21,5],[29,6],[38,5],[46,7],[56,6],[65,5],[73,7],[83,6],[92,38]],
    plats: [
      {x:4,y:9,w:3}, {x:9,y:6,w:2}, {x:13,y:8,w:3}, {x:18,y:5,w:2},
      {x:22,y:9,w:3}, {x:26,y:6,w:2}, {x:30,y:8,w:4}, {x:35,y:5,w:2},
      {x:39,y:9,w:3}, {x:43,y:6,w:2}, {x:47,y:7,w:4}, {x:53,y:4,w:2},
      {x:57,y:9,w:3}, {x:62,y:6,w:2}, {x:66,y:8,w:3}, {x:70,y:5,w:2},
      {x:74,y:9,w:4}, {x:80,y:6,w:2}, {x:84,y:8,w:3}, {x:89,y:5,w:2},
      {x:93,y:9,w:3}, {x:98,y:6,w:4}, {x:104,y:3,w:3}, {x:108,y:8,w:3},
      {x:113,y:5,w:4}, {x:119,y:7,w:3}, {x:124,y:4,w:3},
    ],
    platEnemyMinW: 3,
    spikyChance: 0.45,
  },
];

// ─────────────────────────────────────────────────────────────
// 사운드 (WebAudio 간단 신스)
// ─────────────────────────────────────────────────────────────
let audioCtx = null, muted = false;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = null, delay = 0) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const SFX = {
  jump:  () => tone(420, 0.16, 'square', 0.05, 780),
  coin:  () => { tone(988, 0.07, 'square', 0.05); tone(1319, 0.16, 'square', 0.05, null, 0.06); },
  stomp: () => tone(320, 0.14, 'square', 0.07, 90),
  bump:  () => tone(160, 0.1, 'square', 0.05, 80),
  die:   () => { tone(500, 0.12, 'square', 0.07, 380); tone(300, 0.5, 'square', 0.07, 70, 0.14); },
  clear: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, null, i * 0.13)),
  life:  () => [784, 988, 1319].forEach((f, i) => tone(f, 0.14, 'triangle', 0.06, null, i * 0.09)),
  over:  () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.32, 'sawtooth', 0.06, null, i * 0.22)),
};

// ─────────────────────────────────────────────────────────────
// 입력
// ─────────────────────────────────────────────────────────────
const keys = Object.create(null);
const HANDLED = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space',
                         'KeyA','KeyD','KeyW','KeyS','KeyZ','KeyR','KeyM','Enter']);
let jumpPressedEdge = false;

addEventListener('keydown', e => {
  if (HANDLED.has(e.code)) e.preventDefault();
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (!keys[e.code]) {
    if (isJumpCode(e.code)) jumpPressedEdge = true;
    if (e.code === 'KeyR') requestRestart();
    if (e.code === 'KeyM') muted = !muted;
    if (e.code === 'Enter') confirmPressed = true;
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function isJumpCode(c) { return c === 'ArrowUp' || c === 'Space' || c === 'KeyW' || c === 'KeyZ'; }
function leftHeld()  { return !!(keys.ArrowLeft  || keys.KeyA); }
function rightHeld() { return !!(keys.ArrowRight || keys.KeyD); }
function downHeld()  { return !!(keys.ArrowDown  || keys.KeyS); }
function jumpHeld()  { return !!(keys.ArrowUp || keys.Space || keys.KeyW || keys.KeyZ); }

let confirmPressed = false;
let restartRequested = false;
function requestRestart() { restartRequested = true; }

// 마우스/터치로도 시작 가능
cv.addEventListener('pointerdown', () => {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  confirmPressed = true;
});

// ─────────────────────────────────────────────────────────────
// 레벨 빌드
// ─────────────────────────────────────────────────────────────
// 결정론적 유사난수 (스테이지마다 동일한 배치가 나오도록)
function makeRng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function buildLevel(def, index) {
  const W = def.width;
  const grid = [];
  for (let y = 0; y < ROWS; y++) grid.push(new Array(W).fill(TILE_EMPTY));

  for (const [x0, len] of def.ground) {
    for (let x = x0; x < x0 + len && x < W; x++) {
      grid[GROUND_ROW][x] = TILE_SOLID;
      grid[GROUND_ROW + 1][x] = TILE_SOLID;
    }
  }
  for (const p of def.plats) {
    for (let x = p.x; x < p.x + p.w; x++) {
      if (x >= 0 && x < W && p.y >= 0 && p.y < ROWS) grid[p.y][x] = TILE_ONEWAY;
    }
  }

  // ── 코인 ─────────────────────────────
  const coins = [];
  const addCoin = (tx, ty) => {
    if (tx < 0 || tx >= W || ty < 0 || ty >= ROWS) return;
    if (grid[ty][tx] !== TILE_EMPTY) return;
    coins.push({ x: tx * T + T / 2, y: ty * T + T / 2, got: false, ph: (tx * 17 + ty * 41) % 360 });
  };
  // 발판 위에 한 줄
  for (const p of def.plats) {
    const n = Math.min(p.w, 5);
    const off = Math.floor((p.w - n) / 2);
    for (let i = 0; i < n; i++) addCoin(p.x + off + i, p.y - 1);
  }
  // 낭떠러지 위에 아치 모양
  for (let i = 0; i < def.ground.length - 1; i++) {
    const gapStart = def.ground[i][0] + def.ground[i][1];
    const gapEnd = def.ground[i + 1][0];
    const n = gapEnd - gapStart;
    if (n <= 0) continue;
    for (let k = 0; k < n; k++) {
      const t = n === 1 ? 0.5 : k / (n - 1);
      const lift = Math.round(Math.sin(t * Math.PI) * 1.4);
      addCoin(gapStart + k, GROUND_ROW - 2 - lift);
    }
  }

  // ── 적 ───────────────────────────────
  const rng = makeRng(1234 + index * 977);
  const enemies = [];
  const addEnemy = (tx, row, minT, maxT, type) => {
    const w = 32, h = type === 'spiky' ? 28 : 30;
    enemies.push({
      x: tx * T + (T - w) / 2, y: row * T + (T - h),
      w, h, dir: rng() < 0.5 ? -1 : 1,
      minX: minT * T, maxX: (maxT + 1) * T,
      spd: type === 'spiky' ? 0.85 : 1.15 + index * 0.12,
      type, dead: false, deadT: 0, anim: rng() * 100,
    });
  };
  // 지면 위
  def.ground.forEach((seg, si) => {
    const [x0, len] = seg;
    const isFirst = si === 0;
    if (len < (isFirst ? 12 : 6)) return;
    // 첫 구간은 시작 지점에서 충분히 떨어뜨려 스폰킬을 막는다
    const lo = isFirst ? Math.max(x0 + 1, 8) : x0 + 1;
    const hi = x0 + len - 2;
    const count = len >= 18 ? 2 : 1;
    for (let c = 0; c < count; c++) {
      const span = Math.floor((hi - lo + 1) / count);
      const a = lo + span * c, b = a + span - 1;
      if (b - a < 2) continue;
      let sx = Math.floor((a + b) / 2);
      if (isFirst && c === 0) sx = Math.max(sx, x0 + len - 4);   // 시작 지점에서 멀리
      const type = rng() < def.spikyChance ? 'spiky' : 'walker';
      addEnemy(sx, GROUND_ROW - 1, a, b, type);
    }
  });
  // 발판 위
  for (const p of def.plats) {
    if (p.w < def.platEnemyMinW) continue;
    if (rng() < 0.42) continue;
    addEnemy(p.x + Math.floor(p.w / 2), p.y - 1, p.x, p.x + p.w - 1, 'walker');
  }

  // ── 골인 깃발 ─────────────────────────
  const last = def.ground[def.ground.length - 1];
  const flagTile = last[0] + last[1] - 5;
  const flag = {
    x: flagTile * T + T / 2,
    baseY: GROUND_ROW * T,
    topY: (GROUND_ROW - 7) * T,
    bannerY: (GROUND_ROW - 6.6) * T,
    reached: false,
  };

  return {
    def, index, W, grid, coins, enemies, flag,
    theme: THEMES[index % THEMES.length],
    startX: 2 * T + 6, startY: (GROUND_ROW - 1) * T,
    totalCoins: coins.length,
    pixW: W * T,
  };
}

const LEVELS = LEVEL_DEFS.map(buildLevel);

// ─────────────────────────────────────────────────────────────
// 게임 상태
// ─────────────────────────────────────────────────────────────
const S = { TITLE:'title', PLAY:'play', DEAD:'dead', CLEAR:'clear', OVER:'over', WIN:'win' };

const game = {
  state: S.TITLE,
  levelIndex: 0,
  level: LEVELS[0],
  lives: 3,
  score: 0,
  nextLifeAt: 5000,
  coinsGot: 0,
  timer: 0,
  camX: 0,
  frame: 0,
};

const player = {
  x: 0, y: 0, w: 26, h: 34,
  vx: 0, vy: 0,
  onGround: false, facing: 1,
  coyote: 0, buffer: 0,
  runAnim: 0, squash: 0,
  jumping: false,
  spawnGrace: 0,
};

let particles = [];
let floatTexts = [];

function resetPlayer() {
  const L = game.level;
  player.x = L.startX; player.y = L.startY;
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.facing = 1;
  player.coyote = 0; player.buffer = 0; player.jumping = false;
  player.runAnim = 0; player.squash = 0;
  player.spawnGrace = 40;
  game.camX = 0;
}

function loadLevel(i) {
  game.levelIndex = i;
  game.level = LEVELS[i];
  // 코인/적 상태 초기화
  for (const c of game.level.coins) c.got = false;
  for (const e of game.level.enemies) { e.dead = false; e.deadT = 0; }
  game.level.flag.reached = false;
  game.coinsGot = 0;
  particles = []; floatTexts = [];
  resetPlayer();
}

function startGame() {
  game.lives = 3;
  game.score = 0;
  game.nextLifeAt = 5000;
  loadLevel(0);
  game.state = S.PLAY;
}

// ─────────────────────────────────────────────────────────────
// 충돌 판정
// ─────────────────────────────────────────────────────────────
function tileAt(tx, ty) {
  const L = game.level;
  if (ty < 0 || ty >= ROWS || tx < 0 || tx >= L.W) return TILE_EMPTY;
  return L.grid[ty][tx];
}

function moveAndCollide(o, ignoreOneWay) {
  const L = game.level;

  // ── X축 ──
  o.x += o.vx;
  if (o.x < 0) { o.x = 0; o.vx = 0; }
  if (o.x + o.w > L.pixW) { o.x = L.pixW - o.w; o.vx = 0; }
  {
    const y0 = Math.floor(o.y / T), y1 = Math.floor((o.y + o.h - 1) / T);
    if (o.vx > 0) {
      const tx = Math.floor((o.x + o.w - 1) / T);
      for (let ty = y0; ty <= y1; ty++) {
        if (tileAt(tx, ty) === TILE_SOLID) { o.x = tx * T - o.w; o.vx = 0; break; }
      }
    } else if (o.vx < 0) {
      const tx = Math.floor(o.x / T);
      for (let ty = y0; ty <= y1; ty++) {
        if (tileAt(tx, ty) === TILE_SOLID) { o.x = (tx + 1) * T; o.vx = 0; break; }
      }
    }
  }

  // ── Y축 ──
  const prevBottom = o.y + o.h;
  o.y += o.vy;
  o.onGround = false;
  {
    const x0 = Math.floor(o.x / T), x1 = Math.floor((o.x + o.w - 1) / T);
    if (o.vy > 0) {
      const ty = Math.floor((o.y + o.h - 1) / T);
      for (let tx = x0; tx <= x1; tx++) {
        const t = tileAt(tx, ty);
        if (t === TILE_SOLID ||
            (t === TILE_ONEWAY && !ignoreOneWay && prevBottom <= ty * T + 2)) {
          o.y = ty * T - o.h;
          if (o.vy > 8) player.squash = Math.min(1, o.vy / 16);
          o.vy = 0; o.onGround = true;
          break;
        }
      }
    } else if (o.vy < 0) {
      const ty = Math.floor(o.y / T);
      for (let tx = x0; tx <= x1; tx++) {
        if (tileAt(tx, ty) === TILE_SOLID) {
          o.y = (ty + 1) * T; o.vy = 0.6;
          SFX.bump();
          break;
        }
      }
    }
  }
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ─────────────────────────────────────────────────────────────
// 이펙트
// ─────────────────────────────────────────────────────────────
function burst(x, y, color, n, spread = 3, life = 34) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * spread + 0.6;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.2,
      life, maxLife: life, color, size: 2 + Math.random() * 3, grav: 0.16,
    });
  }
}
function addFloatText(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 50 });
}

// ─────────────────────────────────────────────────────────────
// 업데이트
// ─────────────────────────────────────────────────────────────
function addScore(n, x, y, label) {
  game.score += n;
  if (x !== undefined) addFloatText(x, y, label || ('+' + n), '#ffe66d');
  while (game.score >= game.nextLifeAt) {
    game.nextLifeAt += 5000;
    game.lives++;
    SFX.life();
    addFloatText(player.x + player.w / 2, player.y - 24, '1UP!', '#7dff8a');
  }
}

function killPlayer() {
  if (game.state !== S.PLAY) return;
  game.state = S.DEAD;
  game.timer = 0;
  player.vy = -11.5;
  player.vx = 0;
  SFX.die();
  burst(player.x + player.w / 2, player.y + player.h / 2, '#ff6b6b', 18, 4);
}

function updatePlay() {
  const L = game.level;
  if (player.spawnGrace > 0) player.spawnGrace--;

  // ── 입력 → 가속 ──
  const acc = player.onGround ? ACC : AIR_ACC;
  let dir = 0;
  if (leftHeld()) dir -= 1;
  if (rightHeld()) dir += 1;

  if (dir !== 0) {
    player.vx += acc * dir;
    player.facing = dir;
    // 반대 방향 전환 시 빠른 반응
    if (Math.sign(player.vx) !== dir) player.vx += acc * dir * 0.8;
  } else {
    player.vx *= player.onGround ? FRIC : AIR_FRIC;
    if (Math.abs(player.vx) < 0.08) player.vx = 0;
  }
  player.vx = Math.max(-MAXSPD, Math.min(MAXSPD, player.vx));

  // ── 점프 (코요테 타임 + 입력 버퍼 + 가변 높이) ──
  if (player.onGround) player.coyote = COYOTE; else if (player.coyote > 0) player.coyote--;
  if (jumpPressedEdge) player.buffer = BUFFER; else if (player.buffer > 0) player.buffer--;

  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = JUMP_V;
    player.onGround = false;
    player.jumping = true;
    player.buffer = 0; player.coyote = 0;
    player.squash = -0.5;
    SFX.jump();
    burst(player.x + player.w / 2, player.y + player.h, '#ffffff', 5, 1.6, 20);
  }
  if (player.jumping && player.vy < 0 && !jumpHeld()) {
    player.vy *= JUMP_CUT;
    player.jumping = false;
  }
  if (player.vy >= 0) player.jumping = false;

  // ── 중력 ──
  player.vy = Math.min(MAXFALL, player.vy + GRAV);

  moveAndCollide(player, downHeld());

  // 애니메이션
  if (player.onGround && Math.abs(player.vx) > 0.4) player.runAnim += Math.abs(player.vx) * 0.055;
  else if (player.onGround) player.runAnim = 0;
  player.squash *= 0.82;

  // ── 낙사 ──
  if (player.y > VH + 60) { killPlayer(); return; }

  // ── 코인 ──
  for (const c of L.coins) {
    if (c.got) continue;
    const dx = (player.x + player.w / 2) - c.x;
    const dy = (player.y + player.h / 2) - c.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 26) {
      c.got = true;
      game.coinsGot++;
      addScore(100, c.x, c.y - 6);
      burst(c.x, c.y, '#ffd93d', 9, 2.4, 26);
      SFX.coin();
    }
  }

  // ── 적 ──
  for (const e of L.enemies) {
    if (e.dead) { e.deadT++; continue; }
    e.anim += 0.12;
    e.x += e.spd * e.dir;
    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
    if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }

    if (player.spawnGrace > 0) continue;
    if (!overlap(player, e)) continue;

    const stomping = player.vy > 0.5 &&
                     (player.y + player.h - player.vy) <= e.y + 14;
    if (stomping && e.type !== 'spiky') {
      e.dead = true; e.deadT = 0;
      player.vy = jumpHeld() ? -13.0 : -9.5;
      player.jumping = jumpHeld();
      addScore(200, e.x + e.w / 2, e.y - 6);
      burst(e.x + e.w / 2, e.y + e.h / 2, '#a8641e', 12, 3);
      SFX.stomp();
    } else {
      killPlayer();
      return;
    }
  }

  // ── 골인 ──
  const f = L.flag;
  const flagBox = { x: f.x - 16, y: f.topY, w: 32, h: f.baseY - f.topY };
  if (!f.reached && overlap(player, flagBox)) {
    f.reached = true;
    game.state = S.CLEAR;
    game.timer = 0;
    const bonus = 1000 + game.lives * 200 +
                  (game.coinsGot === L.totalCoins ? 1000 : 0);
    game.score += bonus;
    SFX.clear();
    for (let i = 0; i < 3; i++)
      burst(f.x, f.topY + 30 + i * 30, ['#ffd93d','#7dff8a','#6bd6ff'][i], 12, 3.5, 50);
  }

  // ── 카메라 (데드존 + 부드러운 추적) ──
  const target = player.x + player.w / 2 - VW * 0.42;
  game.camX += (target - game.camX) * 0.12;
  game.camX = Math.max(0, Math.min(L.pixW - VW, game.camX));
}

function updateEffects() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.98;
    if (--p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const t = floatTexts[i];
    t.y -= 0.9;
    if (--t.life <= 0) floatTexts.splice(i, 1);
  }
}

function update() {
  game.frame++;

  if (restartRequested) {
    restartRequested = false;
    if (game.state === S.PLAY || game.state === S.DEAD) {
      loadLevel(game.levelIndex);
      game.state = S.PLAY;
    } else {
      startGame();
    }
    jumpPressedEdge = false; confirmPressed = false;
    return;
  }

  switch (game.state) {
    case S.TITLE:
      if (jumpPressedEdge || confirmPressed) startGame();
      break;

    case S.PLAY:
      updatePlay();
      break;

    case S.DEAD: {
      game.timer++;
      player.vy = Math.min(MAXFALL, player.vy + GRAV);
      player.y += player.vy;
      if (game.timer > 95) {
        game.lives--;
        if (game.lives <= 0) { game.state = S.OVER; game.timer = 0; SFX.over(); }
        else { loadLevel(game.levelIndex); game.state = S.PLAY; }
      }
      break;
    }

    case S.CLEAR:
      game.timer++;
      player.vx *= 0.8;
      player.vy = Math.min(MAXFALL, player.vy + GRAV);
      moveAndCollide(player, false);
      if (game.timer > 150) {
        if (game.levelIndex + 1 < LEVELS.length) {
          loadLevel(game.levelIndex + 1);
          game.state = S.PLAY;
        } else {
          game.state = S.WIN; game.timer = 0;
        }
      }
      break;

    case S.OVER:
    case S.WIN:
      game.timer++;
      if (game.timer > 40 && (jumpPressedEdge || confirmPressed)) startGame();
      break;
  }

  updateEffects();
  jumpPressedEdge = false;
  confirmPressed = false;
}

// ─────────────────────────────────────────────────────────────
// 렌더링
// ─────────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawBackground(th, cam) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, th.sky[0]);
  g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // 구름 (아주 느린 시차)
  ctx.fillStyle = th.cloud;
  ctx.globalAlpha = 0.85;
  for (let i = 0; i < 9; i++) {
    const bx = (i * 337 + 90);
    const x = ((bx - cam * 0.12) % (VW + 360)) - 180;
    const y = 40 + ((i * 71) % 150);
    const s = 0.65 + ((i * 13) % 7) / 10;
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 24 * s, y - 8 * s, 27 * s, 0, Math.PI * 2);
    ctx.arc(x + 50 * s, y + 2 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 먼 언덕
  ctx.fillStyle = th.far;
  for (let i = -1; i < 14; i++) {
    const x = i * 230 - (cam * 0.25) % 230;
    ctx.beginPath();
    ctx.moveTo(x - 60, VH);
    ctx.quadraticCurveTo(x + 55, VH - 210, x + 175, VH);
    ctx.fill();
  }
  // 가까운 언덕
  ctx.fillStyle = th.near;
  for (let i = -1; i < 16; i++) {
    const x = i * 165 - (cam * 0.5) % 165;
    ctx.beginPath();
    ctx.moveTo(x - 50, VH);
    ctx.quadraticCurveTo(x + 45, VH - 135, x + 140, VH);
    ctx.fill();
  }

  // 배경 덤불
  ctx.fillStyle = th.deco;
  for (let i = -1; i < 20; i++) {
    const x = i * 128 - (cam * 0.72) % 128;
    const y = VH - 92;
    ctx.beginPath();
    ctx.arc(x, y, 20, Math.PI, 0);
    ctx.arc(x + 26, y, 26, Math.PI, 0);
    ctx.arc(x + 54, y, 19, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
  }
}

function drawTiles(L, th, cam) {
  const x0 = Math.max(0, Math.floor(cam / T) - 1);
  const x1 = Math.min(L.W - 1, Math.floor((cam + VW) / T) + 1);

  for (let tx = x0; tx <= x1; tx++) {
    for (let ty = 0; ty < ROWS; ty++) {
      const t = L.grid[ty][tx];
      if (t === TILE_EMPTY) continue;
      const px = Math.round(tx * T - cam), py = ty * T;

      if (t === TILE_SOLID) {
        const isTop = ty === 0 || L.grid[ty - 1][tx] !== TILE_SOLID;
        ctx.fillStyle = (ty % 2 === 0) ? th.dirt : th.dirt2;
        ctx.fillRect(px, py, T, T);
        // 벽돌 무늬
        ctx.strokeStyle = 'rgba(0,0,0,.15)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px, py + T / 2); ctx.lineTo(px + T, py + T / 2);
        const off = (ty % 2) ? 0 : T / 2;
        ctx.moveTo(px + off, py); ctx.lineTo(px + off, py + T / 2);
        ctx.moveTo(px + T / 2 - off + (off ? 0 : T / 2), py + T / 2);
        ctx.lineTo(px + T / 2 - off + (off ? 0 : T / 2), py + T);
        ctx.stroke();

        if (isTop) {
          ctx.fillStyle = th.top;
          ctx.fillRect(px, py, T, 12);
          ctx.fillStyle = th.top2;
          ctx.fillRect(px, py + 12, T, 4);
          // 잔디 결
          ctx.fillStyle = 'rgba(255,255,255,.22)';
          ctx.fillRect(px + 4, py + 2, 6, 4);
          ctx.fillRect(px + 22, py + 3, 8, 3);
        }
      } else { // ONEWAY
        ctx.fillStyle = th.plat;
        roundRect(px + 1, py + 8, T - 2, 24, 5); ctx.fill();
        ctx.fillStyle = th.platTop;
        roundRect(px + 1, py + 8, T - 2, 9, 4); ctx.fill();
        ctx.strokeStyle = th.platEdge;
        ctx.lineWidth = 2;
        roundRect(px + 1, py + 8, T - 2, 24, 5); ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,.12)';
        ctx.fillRect(px + T / 2 - 1, py + 18, 2, 12);
      }
    }
  }
}

function drawCoin(c, cam) {
  const px = c.x - cam;
  if (px < -40 || px > VW + 40) return;
  const t = (game.frame + c.ph) * 0.06;
  const bob = Math.sin(t) * 3.2;
  const wScale = Math.abs(Math.cos(t * 0.9));
  const y = c.y + bob;

  ctx.save();
  ctx.translate(px, y);
  ctx.scale(Math.max(0.12, wScale), 1);

  ctx.fillStyle = '#c99a12';
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd93d';
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff2a8';
  ctx.beginPath(); ctx.arc(-2.5, -3, 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#a97c08'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -5.5); ctx.lineTo(0, 5.5); ctx.stroke();
  ctx.restore();

  // 반짝임
  const sp = Math.sin((game.frame + c.ph) * 0.11);
  if (sp > 0.72) {
    const s = (sp - 0.72) / 0.28 * 8;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * (sp - 0.72) / 0.28) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px - s - 8, y - 10); ctx.lineTo(px + s - 8, y - 10);
    ctx.moveTo(px - 8, y - 10 - s); ctx.lineTo(px - 8, y - 10 + s);
    ctx.stroke();
  }
}

function drawEnemy(e, cam) {
  const px = e.x - cam;
  if (px < -60 || px > VW + 60) return;

  if (e.dead) {
    const k = Math.min(1, e.deadT / 12);
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - e.deadT / 45);
    ctx.translate(px + e.w / 2, e.y + e.h);
    ctx.scale(1 + k * 0.35, Math.max(0.12, 1 - k));
    ctx.fillStyle = '#8b4a1c';
    roundRect(-e.w / 2, -e.h, e.w, e.h, 9); ctx.fill();
    ctx.restore();
    return;
  }

  const step = Math.sin(e.anim) ;
  ctx.save();
  ctx.translate(px + e.w / 2, e.y + e.h);

  if (e.type === 'spiky') {
    // 가시 적 (밟을 수 없음)
    ctx.fillStyle = '#2f2a4a';
    ctx.beginPath(); ctx.ellipse(0, -13, 15, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b5fd0';
    ctx.beginPath(); ctx.ellipse(0, -13, 12, 10, 0, 0, Math.PI * 2); ctx.fill();
    // 가시
    ctx.fillStyle = '#e8e3ff';
    for (let i = 0; i < 7; i++) {
      const a = Math.PI + (i / 6) * Math.PI;
      const cx = Math.cos(a) * 12, cy = -13 + Math.sin(a) * 10;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a + 1.4) * 4, cy + Math.sin(a + 1.4) * 4);
      ctx.lineTo(cx + Math.cos(a) * 8, cy + Math.sin(a) * 8);
      ctx.lineTo(cx + Math.cos(a - 1.4) * 4, cy + Math.sin(a - 1.4) * 4);
      ctx.closePath(); ctx.fill();
    }
    // 눈
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-5, -13, 3.6, 0, Math.PI * 2); ctx.arc(5, -13, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1030';
    ctx.beginPath(); ctx.arc(-5 + e.dir * 1.4, -13, 2, 0, Math.PI * 2);
    ctx.arc(5 + e.dir * 1.4, -13, 2, 0, Math.PI * 2); ctx.fill();
    // 발
    ctx.fillStyle = '#241f3d';
    roundRect(-11, -4 + step * 1.5, 9, 4, 2); ctx.fill();
    roundRect(2, -4 - step * 1.5, 9, 4, 2); ctx.fill();
  } else {
    // 버섯 적 (밟으면 처치)
    ctx.fillStyle = '#3a2410';
    roundRect(-12, -6 + Math.max(0, step) * 2, 10, 6, 3); ctx.fill();
    roundRect(2, -6 + Math.max(0, -step) * 2, 10, 6, 3); ctx.fill();

    ctx.fillStyle = '#a8641e';
    ctx.beginPath();
    ctx.moveTo(-16, -5);
    ctx.quadraticCurveTo(-16, -30, 0, -30);
    ctx.quadraticCurveTo(16, -30, 16, -5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c47c2c';
    ctx.beginPath();
    ctx.moveTo(-13, -12);
    ctx.quadraticCurveTo(-13, -27, 0, -27);
    ctx.quadraticCurveTo(13, -27, 13, -12);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#fdf3e3';
    ctx.beginPath(); ctx.ellipse(-5.5, -14, 4.4, 5.4, 0, 0, Math.PI * 2);
    ctx.ellipse(5.5, -14, 4.4, 5.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#241408';
    ctx.beginPath(); ctx.ellipse(-5.5 + e.dir * 1.6, -14, 2.1, 3, 0, 0, Math.PI * 2);
    ctx.ellipse(5.5 + e.dir * 1.6, -14, 2.1, 3, 0, 0, Math.PI * 2); ctx.fill();
    // 찡그린 눈썹
    ctx.strokeStyle = '#241408'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-10, -21); ctx.lineTo(-2, -18);
    ctx.moveTo(10, -21); ctx.lineTo(2, -18);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFlag(L, cam) {
  const f = L.flag;
  const px = f.x - cam;
  if (px < -80 || px > VW + 80) return;

  // 받침
  ctx.fillStyle = '#5c6470';
  roundRect(px - 16, f.baseY - 12, 32, 14, 4); ctx.fill();
  ctx.fillStyle = '#7c8694';
  roundRect(px - 16, f.baseY - 12, 32, 6, 3); ctx.fill();

  // 기둥
  ctx.fillStyle = '#cfd6e2';
  ctx.fillRect(px - 3, f.topY, 6, f.baseY - f.topY - 8);
  ctx.fillStyle = '#9aa4b4';
  ctx.fillRect(px + 1, f.topY, 2, f.baseY - f.topY - 8);
  // 꼭대기 구슬
  ctx.fillStyle = '#ffd93d';
  ctx.beginPath(); ctx.arc(px, f.topY - 4, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff2a8';
  ctx.beginPath(); ctx.arc(px - 2, f.topY - 6, 2.6, 0, Math.PI * 2); ctx.fill();

  // 깃발 (클리어하면 아래로 내려감)
  let by = f.bannerY;
  if (f.reached) {
    const k = Math.min(1, game.timer / 60);
    by = f.bannerY + k * (f.baseY - 46 - f.bannerY);
  }
  const wave = Math.sin(game.frame * 0.11) * 4;
  ctx.fillStyle = f.reached ? '#66d97a' : '#e8453c';
  ctx.beginPath();
  ctx.moveTo(px + 2, by);
  ctx.quadraticCurveTo(px + 26 + wave, by + 6, px + 46, by + 4 - wave * 0.5);
  ctx.lineTo(px + 46, by + 28 - wave * 0.5);
  ctx.quadraticCurveTo(px + 26 - wave, by + 32, px + 2, by + 30);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath();
  ctx.moveTo(px + 2, by);
  ctx.quadraticCurveTo(px + 26 + wave, by + 6, px + 46, by + 4 - wave * 0.5);
  ctx.lineTo(px + 46, by + 12); ctx.lineTo(px + 2, by + 11);
  ctx.closePath(); ctx.fill();

  // 골 표시
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GOAL', px, f.baseY - 20);
  ctx.textAlign = 'left';
}

function drawPlayer(cam) {
  if (game.state === S.TITLE) return;
  const px = Math.round(player.x - cam), py = Math.round(player.y);
  const sq = player.squash;
  const sx = 1 - sq * 0.28, sy = 1 + sq * 0.32;

  ctx.save();
  ctx.translate(px + player.w / 2, py + player.h);
  ctx.scale(player.facing * sx, sy);

  if (player.spawnGrace > 0 && Math.floor(game.frame / 4) % 2 === 0) ctx.globalAlpha = 0.45;

  const airborne = !player.onGround;
  const run = Math.sin(player.runAnim * Math.PI);
  const legA = airborne ? 0.5 : run * 4;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(0, 1, 12, 3.5, 0, 0, Math.PI * 2); ctx.fill();

  // 다리
  ctx.fillStyle = '#2b4fb8';
  roundRect(-9, -11 + (airborne ? -2 : 0), 8, 11 - (airborne ? 2 : 0) + legA * 0.3, 3); ctx.fill();
  roundRect(1, -11 + (airborne ? -2 : 0), 8, 11 - (airborne ? 2 : 0) - legA * 0.3, 3); ctx.fill();
  // 신발
  ctx.fillStyle = '#6b3a12';
  roundRect(-11, -3 + legA * 0.25, 11, 4, 2); ctx.fill();
  roundRect(1, -3 - legA * 0.25, 11, 4, 2); ctx.fill();

  // 몸통 (멜빵바지)
  ctx.fillStyle = '#e03a34';
  roundRect(-10, -25, 20, 11, 4); ctx.fill();
  ctx.fillStyle = '#2b4fb8';
  roundRect(-9, -20, 18, 10, 3); ctx.fill();
  ctx.fillRect(-6, -25, 4, 7);
  ctx.fillRect(2, -25, 4, 7);
  ctx.fillStyle = '#ffd93d';
  ctx.beginPath(); ctx.arc(-4, -19, 1.7, 0, Math.PI * 2);
  ctx.arc(4, -19, 1.7, 0, Math.PI * 2); ctx.fill();

  // 팔
  ctx.fillStyle = '#e03a34';
  const armSwing = airborne ? -5 : -run * 3;
  roundRect(-13, -24 + armSwing * 0.4, 6, 9, 3); ctx.fill();
  roundRect(7, -24 - armSwing * 0.4, 6, 9, 3); ctx.fill();
  ctx.fillStyle = '#fff';
  roundRect(-13, -16 + armSwing * 0.4, 6, 5, 2.5); ctx.fill();
  roundRect(7, -16 - armSwing * 0.4, 6, 5, 2.5); ctx.fill();

  // 머리
  ctx.fillStyle = '#f5c69a';
  roundRect(-9, -38, 18, 14, 6); ctx.fill();
  // 귀
  ctx.fillStyle = '#eab887';
  roundRect(-11, -32, 4, 5, 2); ctx.fill();
  // 눈
  ctx.fillStyle = '#fff';
  roundRect(2, -34, 5, 6, 2); ctx.fill();
  ctx.fillStyle = '#243042';
  roundRect(4, -33, 2.6, 4, 1.2); ctx.fill();
  // 코
  ctx.fillStyle = '#eaa877';
  roundRect(6, -29, 5, 4, 2); ctx.fill();
  // 콧수염
  ctx.fillStyle = '#3a2412';
  roundRect(0, -27, 10, 3.6, 1.6); ctx.fill();
  // 구레나룻
  roundRect(-8, -32, 4, 7, 2); ctx.fill();

  // 모자
  ctx.fillStyle = '#e03a34';
  roundRect(-10, -42, 20, 7, 3.5); ctx.fill();
  roundRect(0, -38, 14, 4, 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -38.5, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e03a34';
  ctx.font = 'bold 6px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('C', 0, -36.4);
  ctx.textAlign = 'left';

  ctx.restore();
}

function drawEffects(cam) {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cam - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  for (const t of floatTexts) {
    ctx.globalAlpha = Math.min(1, t.life / 22);
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillText(t.text, t.x - cam + 1, t.y + 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x - cam, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawMiniIcon(kind, x, y) {
  ctx.save();
  ctx.translate(x, y);
  if (kind === 'coin') {
    ctx.fillStyle = '#c99a12'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd93d'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#a97c08'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(0, 3.5); ctx.stroke();
  } else { // life (모자)
    ctx.fillStyle = '#e03a34';
    roundRect(-8, -6, 16, 6, 3); ctx.fill();
    roundRect(0, -3, 11, 3.4, 1.6); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, -3, 2.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawHUD() {
  const L = game.level;
  ctx.save();
  // 상단 패널
  const grad = ctx.createLinearGradient(0, 0, 0, 52);
  grad.addColorStop(0, 'rgba(10,14,32,.72)');
  grad.addColorStop(1, 'rgba(10,14,32,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, 58);

  ctx.font = 'bold 19px monospace';
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';

  // 점수
  ctx.fillText('SCORE', 24, 20);
  ctx.fillStyle = '#ffe66d';
  ctx.fillText(String(game.score).padStart(6, '0'), 24, 41);

  // 코인
  drawMiniIcon('coin', 205, 30);
  ctx.fillStyle = '#fff';
  ctx.fillText(game.coinsGot + ' / ' + L.totalCoins, 222, 31);

  // 목숨
  drawMiniIcon('life', 370, 30);
  ctx.fillStyle = '#fff';
  ctx.fillText('× ' + game.lives, 386, 31);

  // 스테이지
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.fillText('STAGE ' + (game.levelIndex + 1) + ' / ' + LEVELS.length, VW - 24, 20);
  ctx.fillStyle = '#a9d8ff';
  ctx.font = 'bold 15px monospace';
  ctx.fillText(L.def.title.split('· ')[1] || '', VW - 24, 41);

  // 진행 바
  const prog = Math.max(0, Math.min(1, (player.x) / (L.flag.x - L.startX)));
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  roundRect(VW / 2 - 130, 12, 260, 8, 4); ctx.fill();
  ctx.fillStyle = '#6bd6ff';
  roundRect(VW / 2 - 130, 12, Math.max(6, 260 * prog), 8, 4); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(VW / 2 - 130 + 260 * prog, 16, 5.5, 0, Math.PI * 2); ctx.fill();

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function centerBox(lines, sub) {
  ctx.save();
  ctx.fillStyle = 'rgba(6,9,22,.74)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  let y = VH / 2 - (lines.length * 34) / 2 - 10;
  for (const l of lines) {
    ctx.font = 'bold ' + (l.size || 40) + 'px monospace';
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillText(l.text, VW / 2 + 3, y + 3);
    ctx.fillStyle = l.color || '#fff';
    ctx.fillText(l.text, VW / 2, y);
    y += (l.gap || 52);
  }
  if (sub) {
    ctx.globalAlpha = 0.55 + Math.sin(game.frame * 0.09) * 0.45;
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#cfe3ff';
    ctx.fillText(sub, VW / 2, y + 14);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawTitle() {
  const th = THEMES[0];
  drawBackground(th, game.frame * 0.35);

  ctx.save();
  ctx.textAlign = 'center';

  // 타이틀
  const bob = Math.sin(game.frame * 0.045) * 6;
  ctx.font = 'bold 64px monospace';
  ctx.lineWidth = 9;
  ctx.strokeStyle = '#1b2450';
  ctx.strokeText('SUPER JUMP', VW / 2, 178 + bob);
  const tg = ctx.createLinearGradient(0, 130, 0, 195);
  tg.addColorStop(0, '#fff6b0'); tg.addColorStop(1, '#ffbe2e');
  ctx.fillStyle = tg;
  ctx.fillText('SUPER JUMP', VW / 2, 178 + bob);

  ctx.font = 'bold 34px monospace';
  ctx.strokeStyle = '#1b2450'; ctx.lineWidth = 7;
  ctx.strokeText('A D V E N T U R E', VW / 2, 222 + bob);
  ctx.fillStyle = '#8ff0a0';
  ctx.fillText('A D V E N T U R E', VW / 2, 222 + bob);

  // 안내 패널
  ctx.fillStyle = 'rgba(10,16,38,.62)';
  roundRect(VW / 2 - 260, 268, 520, 168, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
  roundRect(VW / 2 - 260, 268, 520, 168, 14); ctx.stroke();

  ctx.font = 'bold 17px monospace';
  ctx.fillStyle = '#dce8ff';
  const rows = [
    '← →   좌우 이동',
    '↑ / SPACE   점프 (오래 누르면 높이)',
    '↓   발판 아래로 내려가기',
    '적을 위에서 밟으면 처치, 옆에서 닿으면 사망',
    '깃발에 도달하면 스테이지 클리어!',
  ];
  rows.forEach((r, i) => ctx.fillText(r, VW / 2, 300 + i * 27));

  ctx.globalAlpha = 0.5 + Math.sin(game.frame * 0.1) * 0.5;
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#ffe66d';
  ctx.fillText('SPACE 또는 ENTER 를 눌러 시작', VW / 2, 486);
  ctx.globalAlpha = 1;

  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText('전체 ' + LEVELS.length + ' 스테이지  ·  목숨 3', VW / 2, 518);

  ctx.textAlign = 'left';
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, VW, VH);

  if (game.state === S.TITLE) { drawTitle(); return; }

  const L = game.level, th = L.theme;
  const cam = Math.round(game.camX);

  drawBackground(th, cam);
  drawFlag(L, cam);
  drawTiles(L, th, cam);
  for (const c of L.coins) if (!c.got) drawCoin(c, cam);
  for (const e of L.enemies) if (!e.dead || e.deadT < 45) drawEnemy(e, cam);
  drawPlayer(cam);
  drawEffects(cam);
  drawHUD();

  if (game.state === S.DEAD) {
    ctx.fillStyle = 'rgba(120,10,20,' + Math.min(0.42, game.timer / 160) + ')';
    ctx.fillRect(0, 0, VW, VH);
    if (game.timer > 24) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold 44px monospace';
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText('OUCH!', VW / 2 + 3, VH / 2 + 3);
      ctx.fillStyle = '#ff8f8f'; ctx.fillText('OUCH!', VW / 2, VH / 2);
      ctx.font = 'bold 18px monospace';
      ctx.fillStyle = '#ffd9d9';
      ctx.fillText('남은 목숨  ' + (game.lives - 1), VW / 2, VH / 2 + 36);
      ctx.restore();
      ctx.textAlign = 'left';
    }
  }

  if (game.state === S.CLEAR) {
    ctx.fillStyle = 'rgba(8,20,12,' + Math.min(0.5, game.timer / 120) + ')';
    ctx.fillRect(0, 0, VW, VH);
    const perfect = game.coinsGot === L.totalCoins;
    centerBox([
      { text: 'STAGE CLEAR!', size: 50, color: '#8ff0a0', gap: 56 },
      { text: perfect ? '★ 코인 전부 획득 보너스 +1000 ★' : ('코인  ' + game.coinsGot + ' / ' + L.totalCoins),
        size: 22, color: perfect ? '#ffe66d' : '#dce8ff', gap: 40 },
      { text: 'SCORE  ' + game.score, size: 26, color: '#fff', gap: 40 },
    ], game.levelIndex + 1 < LEVELS.length ? '다음 스테이지로...' : '최종 스테이지 완료!');
  }

  if (game.state === S.OVER) {
    centerBox([
      { text: 'GAME OVER', size: 58, color: '#ff6b6b', gap: 62 },
      { text: '최종 점수  ' + game.score, size: 26, color: '#fff', gap: 40 },
      { text: '도달 스테이지  ' + (game.levelIndex + 1) + ' / ' + LEVELS.length, size: 20, color: '#cfd8ee', gap: 40 },
    ], 'SPACE 또는 ENTER 로 다시 시작  (R: 재시작)');
  }

  if (game.state === S.WIN) {
    // 축하 폭죽
    if (game.frame % 9 === 0) {
      burst(120 + Math.random() * (VW - 240), 100 + Math.random() * 240,
            ['#ffd93d','#8ff0a0','#6bd6ff','#ff8fd0'][Math.floor(Math.random() * 4)], 16, 4.6, 60);
    }
    centerBox([
      { text: '★ CONGRATULATIONS ★', size: 40, color: '#ffe66d', gap: 58 },
      { text: '모든 스테이지 클리어!', size: 34, color: '#8ff0a0', gap: 54 },
      { text: '최종 점수  ' + game.score, size: 28, color: '#fff', gap: 42 },
      { text: '남은 목숨  ' + game.lives, size: 20, color: '#cfd8ee', gap: 40 },
    ], 'SPACE 또는 ENTER 로 다시 도전');
    drawEffects(0);
  }
}

// ─────────────────────────────────────────────────────────────
// 메인 루프 (고정 60fps 스텝 + 보간 없는 안정 렌더)
// ─────────────────────────────────────────────────────────────
const STEP = 1000 / 60;
let last = performance.now();
let acc = 0;

function loop(now) {
  let dt = now - last;
  last = now;
  if (dt > 250) dt = 250;      // 탭 전환 등으로 밀린 시간 버리기
  acc += dt;

  let guard = 0;
  while (acc >= STEP && guard++ < 5) {
    update();
    acc -= STEP;
  }
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
